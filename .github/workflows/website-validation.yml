name: website validation

on:
  push:
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/website-validation.yml"
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/website-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Validate static website
        run: npm run validate:website

      - name: Verify generated calibration files are current
        run: git diff --exit-code -- website/stats
