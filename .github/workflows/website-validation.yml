name: website validation

on:
  push:
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/website-validation.yml"
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/website-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Validate static website
        run: npm run validate:website

      - name: Verify generated calibration files are current
        run: git diff --exit-code -- website/stats
