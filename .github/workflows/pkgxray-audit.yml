name: pkgxray audit

# Supply-chain audit of dependency lockfiles with pkgxray.
#
# Three ways to run:
#   • automatically, when a dependency manifest changes on push / PR;
#   • on demand, via the "Run workflow" button (workflow_dispatch);
#   • from another repo, by calling this as a reusable workflow pinned to a
#     reviewed commit SHA (see docs/integrations/github-actions.md).
#
on:
  workflow_call:
    inputs:
      lockfile:
        description: "Lockfile to audit (blank = auto-detect all)."
        type: string
        default: ""
      package:
        description: "Exact npm package ref to guard instead of a lockfile (name@version)."
        type: string
        default: ""
      fail-on:
        description: "Worst verdict that fails the job: block | review."
        type: string
        default: block
      pkgxray-version:
        description: "Exact npm version of pkgxray to run."
        type: string
        default: "1.0.4"
      output-format:
        description: "Report format: markdown | json."
        type: string
        default: markdown
  workflow_dispatch:
    inputs:
      lockfile:
        description: "Lockfile to audit (blank = auto-detect all)."
        type: string
        default: ""
      package:
        description: "Exact npm package ref to guard instead (name@version)."
        type: string
        default: ""
      fail-on:
        description: "Worst verdict that fails the job: block | review."
        type: string
        default: block
      pkgxray-version:
        description: "Exact npm version of pkgxray to run."
        type: string
        default: "1.0.4"
      output-format:
        description: "Report format: markdown | json."
        type: choice
        options: [markdown, json]
        default: markdown
  push:
    paths:
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - "**/yarn.lock"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-lock.yml"
      - "**/package.json"
  pull_request:
    paths:
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - "**/yarn.lock"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-lock.yml"
      - "**/package.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # npx resolves a name@version spec against the current project before
      # the registry; in this repository the workspace itself is pkgxray at
      # the pinned version, so npx would skip the install and find no binary.
      # Installing into a prefix outside the workspace keeps the install
      # exact-version and non-global while working in any checkout.
      - name: Install pkgxray
        env:
          PKGXRAY_VERSION: ${{ inputs.pkgxray-version || '1.0.4' }}
        working-directory: ${{ runner.temp }}
        run: |
          set -u

          if [[ ! "${PKGXRAY_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::pkgxray-version must be an exact semver, not a mutable tag"
            exit 1
          fi
          npm install --prefix pkgxray-dist --no-fund --no-audit \
            --loglevel error "pkgxray@${PKGXRAY_VERSION}"
          test -x pkgxray-dist/node_modules/.bin/pkgxray

      - name: Audit dependencies or package
        env:
          LOCKFILE: ${{ inputs.lockfile }}
          PACKAGE_REFERENCE: ${{ inputs.package }}
          FAIL_ON: ${{ inputs.fail-on || 'block' }}
          OUTPUT_FORMAT: ${{ inputs.output-format || 'markdown' }}
          PKGXRAY_BIN: ${{ runner.temp }}/pkgxray-dist/node_modules/.bin/pkgxray
        run: |
          set -u

          if [[ "${FAIL_ON}" != "block" && "${FAIL_ON}" != "review" ]]; then
            echo "::error::fail-on must be 'block' or 'review'"
            exit 1
          fi
          if [[ "${OUTPUT_FORMAT}" != "markdown" && "${OUTPUT_FORMAT}" != "json" ]]; then
            echo "::error::output-format must be 'markdown' or 'json'"
            exit 1
          fi
          if [[ -n "${LOCKFILE}" && -n "${PACKAGE_REFERENCE}" ]]; then
            echo "::error::set lockfile or package, not both"
            exit 1
          fi

          blocked=0
          flagged=0

          record_verdict() {
            local label="$1"
            local code="$2"
            case "${code}" in
              2) echo "::error::pkgxray BLOCK: ${label}"; blocked=1 ;;
              3) echo "::warning::pkgxray REVIEW: ${label}"; flagged=1 ;;
              0) echo "pkgxray SAFE: ${label}" ;;
              *) echo "::error::pkgxray failed for ${label} (exit ${code})"; exit 1 ;;
            esac
          }

          if [ -n "${PACKAGE_REFERENCE}" ]; then
            if [[ ! "${PACKAGE_REFERENCE}" =~ ^(@[^/]+/)?[^@/]+@[^[:space:]]+$ ]]; then
              echo "::error::package must be an exact name@version reference"
              exit 1
            fi
            echo "::group::pkgxray guard npm:${PACKAGE_REFERENCE}"
            if "${PKGXRAY_BIN}" guard "npm:${PACKAGE_REFERENCE}" --format "${OUTPUT_FORMAT}"; then
              code=0
            else
              code=$?
            fi
            echo "::endgroup::"
            record_verdict "npm:${PACKAGE_REFERENCE}" "${code}"
          else
            # Resolve the manifests to audit: the explicit input, else all
            # lockfiles in the repo, else fall back to package.json files.
            if [ -n "${LOCKFILE}" ]; then
              printf '%s\n' "${LOCKFILE}" > /tmp/pkgxray-targets
            else
              find . -type d -name node_modules -prune -o \
                \( -name package-lock.json -o -name npm-shrinkwrap.json \
                   -o -name yarn.lock -o -name pnpm-lock.yaml \
                   -o -name pnpm-lock.yml \) -print \
                | sort > /tmp/pkgxray-targets
              if [ ! -s /tmp/pkgxray-targets ]; then
                find . -type d -name node_modules -prune -o \
                  -name package.json -print | sort > /tmp/pkgxray-targets
              fi
            fi

            if [ ! -s /tmp/pkgxray-targets ]; then
              echo "No dependency manifests found — nothing to audit."
              exit 0
            fi

            # Reading from a file keeps the aggregate verdict in this shell.
            while IFS= read -r f; do
              [ -n "${f}" ] || continue
              echo "::group::pkgxray audit ${f}"
              if "${PKGXRAY_BIN}" audit "${f}" --format "${OUTPUT_FORMAT}"; then
                code=0
              else
                code=$?
              fi
              echo "::endgroup::"
              record_verdict "${f}" "${code}"
            done < /tmp/pkgxray-targets
          fi

          if [ "${blocked}" = "1" ]; then
            echo "Failing: a dependency was BLOCKed by pkgxray."
            exit 1
          fi
          if [ "${flagged}" = "1" ] && [ "${FAIL_ON}" = "review" ]; then
            echo "Failing: fail-on=review and a dependency needs REVIEW."
            exit 1
          fi
          echo "pkgxray audit passed (fail-on=${FAIL_ON})."
