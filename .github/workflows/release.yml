name: release

# Publishes pkgxray to npm WITH provenance, but only after it passes its own
# gates — correctness (tests), calibration (benchmark), and its own
# supply-chain guard. A security tool that can't prove its own supply chain has
# no business vetting anyone else's.
#
# Trigger: publishing a GitHub Release (tag like v1.0.3). Also runnable via
# workflow_dispatch with dry_run=true to exercise everything except the publish.
#
# Why the self-guard uses --no-source-scan: pkgxray's source *is* a catalogue of
# attack signatures (injection phrases, `http://1.2.3.4`, `pastebin.com`, bidi
# test characters live in the detector definitions), so a static source scan of
# the scanner necessarily flags itself. That layer is instead exercised, against
# controlled inputs, by `node --test` and `node benchmark/run.js` above. The
# self-guard requires a completed clean OSV check. Post-publish verification
# also binds the published archive to the exact validated digest. This does
# not cryptographically verify npm provenance or prove source parity.

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/verify-release.js"
      - "package.json"
      - "server.json"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every gate but skip npm publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      archive-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Tests
        run: npm test
      - name: Documentation and website checks
        run: |
          npm run test:docs
          npm run validate:website
      - name: Calibration and adversarial regression gates
        run: |
          node benchmark/run.js
          node benchmark/adversarial/run.js --check-baseline
          node benchmark/adversarial/run.js --holdout --check-baseline
      - name: Pack without lifecycle scripts
        run: |
          mkdir -p .pack
          npm pack --ignore-scripts --pack-destination .pack
          mv .pack/pkgxray-*.tgz .pack/package.tgz
      - name: Self-guard (supply-chain layer)
        run: node scripts/verify-release.js archive .pack/package.tgz
      - name: Record checked archive digest
        id: digest
        run: |
          digest="$(sha256sum .pack/package.tgz | cut -d ' ' -f 1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release
          path: .pack/package.tgz
          if-no-files-found: error
          retention-days: 7

  verify-transfer:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-release
          path: release
      - name: Verify artifact transfer (including dry runs)
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.archive-sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  release/package.tgz\n' "$EXPECTED_SHA256" | sha256sum --check --strict

  publish:
    needs: [validate, verify-transfer]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout or repository code executes in the credentialed job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-release
          path: release
      - name: Verify and publish the checked archive
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.archive-sha256 }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  release/package.tgz\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          npm publish ./release/package.tgz --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org

  verify:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Verify published artifact
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.archive-sha256 }}
        run: |
          node scripts/verify-release.js published "$EXPECTED_SHA256"
