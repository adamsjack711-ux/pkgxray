name: pkgxray test

# Runs the zero-dep Node test suite (`node --test`) on every push / PR that
# touches the engine, CLI, or tests. This is the unit-test gate the repo was
# missing — the other workflows only fire on lockfile or hookshot-example
# changes, so pure src/ + test/ PRs had no CI.

on:
  push:
    paths:
      - "src/**"
      - "bin/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pkgxray-test.yml"
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pkgxray-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Prove the whole supported range from package.json `engines.node`
        # (>=18): the floor, the active LTS lines, and current.
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      # Zero runtime dependencies — nothing to install. The suite is Node
      # built-ins only (node --test), so this is just the test run.
      - name: Run tests
        run: node --test
