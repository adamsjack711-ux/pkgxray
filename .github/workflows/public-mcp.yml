name: public-mcp
on:
  pull_request:
    paths:
      - "services/public-mcp/**"
      - "src/**"
      - "browser-extension/auditor.browser.js"
      - "scripts/build-browser-extension.js"
      - ".github/workflows/public-mcp.yml"
  push:
    branches: [main]
    paths:
      - "services/public-mcp/**"
      - "src/**"
      - "browser-extension/auditor.browser.js"
      - "scripts/build-browser-extension.js"
      - ".github/workflows/public-mcp.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/public-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run types
      - run: npm run dry-run
