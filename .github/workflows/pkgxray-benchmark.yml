name: pkgxray calibration benchmark

# Runs the labelled calibration corpus (benchmark/) through the real static
# engine on every push / PR that touches detection code or the corpus. The gate
# fails on exactly the two outcomes that matter: a benign fixture wrongly
# blocked (the "0 false blocks" invariant) or a malicious fixture that passes as
# safe. Benign calibration drift (safe -> review) is reported, not failed.

on:
  push:
    paths:
      - "src/**"
      - "benchmark/**"
      - ".github/workflows/pkgxray-benchmark.yml"
  pull_request:
    paths:
      - "src/**"
      - "benchmark/**"
      - ".github/workflows/pkgxray-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Zero runtime dependencies — the benchmark drives src/auditor.js directly.
      - name: Run calibration benchmark
        run: node ./benchmark/run.js
