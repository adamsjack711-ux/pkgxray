name: pkgxray calibration benchmark

# Runs the labelled calibration corpus (benchmark/) through the real static
# engine on every push / PR that touches detection code or the corpus. The gate
# fails on unexpected false blocks, full misses, and unapproved recall drops.
# This is a fixture regression gate. The manual pkgxray-validation workflow
# separately measures the committed real-package cohorts.

on:
  push:
    paths:
      - "src/**"
      - "benchmark/**"
      - "test/benchmark-metrics.test.js"
      - ".github/workflows/pkgxray-benchmark.yml"
  pull_request:
    paths:
      - "src/**"
      - "benchmark/**"
      - "test/benchmark-metrics.test.js"
      - ".github/workflows/pkgxray-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Zero runtime dependencies — the benchmark drives src/auditor.js directly.
      - name: Run calibration benchmark
        run: node ./benchmark/run.js

      - name: Record separate fixture baselines
        run: |
          mkdir -p "$RUNNER_TEMP/pkgxray-benchmark"
          for cohort in npm pypi mcp; do
            node benchmark/run.js --json --cohort "$cohort" > "$RUNNER_TEMP/pkgxray-benchmark/$cohort.json"
          done

      - name: Save aggregate fixture metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-calibration
          path: ${{ runner.temp }}/pkgxray-benchmark/*.json
          retention-days: 14

      # Preserve per-case detection and benign severity. Diagnostics also
      # require zero SAFE misses/false blocks in these frozen synthetic inputs.
      - name: Check adversarial baseline
        run: |
          node ./benchmark/adversarial/run.js --check-baseline
          node ./benchmark/adversarial/run.js

      - name: Check frozen internal holdout baseline
        run: |
          node ./benchmark/adversarial/run.js --holdout --check-baseline
          node ./benchmark/adversarial/run.js --holdout
