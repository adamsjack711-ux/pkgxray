name: hookshot guard CI

# Build, vet, and test the pkgxray × hookshot guard hook (examples/hookshot).
#
# In this repo the module's go.mod has `replace … => ../..` so it builds inside
# the hookshot fork. Here there is no hookshot parent, so CI drops the replace
# and resolves the real module from the proxy — which also verifies the
# integration compiles against the published hookshot API.

on:
  push:
    paths:
      - "examples/hookshot/**"
      - ".github/workflows/hookshot-guard-ci.yml"
  pull_request:
    paths:
      - "examples/hookshot/**"
      - ".github/workflows/hookshot-guard-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/hookshot
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.21"

      # The repo module go.mod has `replace … => ../..` (valid only inside the
      # hookshot fork). Drop it and resolve the published module first — Go
      # needs the whole module graph to load even a single subpackage.
      - name: Resolve the real hookshot module
        run: |
          # Drop both the in-fork `replace` and the placeholder `v0.0.0`
          # require (valid only under that replace); then pull the real module.
          # Without droprequire, `go get @latest` fails reading the bogus v0.0.0.
          go mod edit -dropreplace github.com/CorridorSecurity/hookshot
          go mod edit -droprequire github.com/CorridorSecurity/hookshot
          go get github.com/CorridorSecurity/hookshot@latest
          go mod tidy

      - name: Build, vet, and test against real hookshot
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Fail if gofmt would change anything
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt needed on:"; echo "${unformatted}"; exit 1
          fi

  # Guard against the two copies of the hook drifting (this repo's
  # examples/hookshot is the source of truth; hookshot's examples/pkgxray-guard
  # is the published mirror). Fails the build if *.go or configs/ differ.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check the hook copy hasn't drifted from the hookshot mirror
        run: |
          # Compare against the published copy in hookshot. Until the upstream PR
          # that adds examples/pkgxray-guard lands, that dir won't exist — skip
          # rather than fail (the check self-activates once it's upstream).
          git clone --depth 1 https://github.com/CorridorSecurity/hookshot.git /tmp/hookshot
          if [ ! -d /tmp/hookshot/examples/pkgxray-guard ]; then
            echo "::notice::hookshot upstream has no examples/pkgxray-guard yet — skipping drift check."
            exit 0
          fi
          chmod +x examples/hookshot/sync-to-hookshot.sh
          PKGXRAY_HOOK_DIR="$GITHUB_WORKSPACE/examples/hookshot" \
          HOOKSHOT_GUARD_DIR=/tmp/hookshot/examples/pkgxray-guard \
            examples/hookshot/sync-to-hookshot.sh --check
