services:
  dashboard:
    image: registry.example/notes:1
    ports: ["8080:80"]
    privileged: true
    environment:
      PASSWORD: sample-password-DO-NOT-PRINT
      CONNECTION: postgres://db-user:db-password-DO-NOT-PRINT@db/notes
      API_TOKEN: sample-token-DO-NOT-PRINT
    labels:
      gateway.auth: label-secret-DO-NOT-PRINT
    command: ["sh", "-c", "echo command-secret-DO-NOT-PRINT; $(touch /tmp/compose-xray-must-not-execute)"]
    volumes:
      - /etc/path-secret-DO-NOT-PRINT:/host/etc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
