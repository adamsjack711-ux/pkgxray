include:
  - ./extra.yaml
services:
  web:
    image: example/web:1
    privileged: true
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT}:80"
    volumes:
      - "${DOCKER_SOCKET:?required}:/var/run/docker.sock:ro"
    environment:
      SECRET: ${PASSWORD}
    extends:
      file: base.yaml
      service: web
